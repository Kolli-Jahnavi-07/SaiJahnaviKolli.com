<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Message Sent | Sai Jahnavi Kolli</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thanksWrap{ min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
    .thanksCard{ max-width: 520px; width:100%; text-align:center; }
    .thanksCard h1{ font-size: 30px; margin: 10px 0 8px; }
    .thanksCard p{ color: var(--muted); line-height: 1.7; margin: 0 0 20px; }
    .thanksCard .ctaRow{ justify-content:center; }
  </style>
</head>
<body>
  <main class="thanksWrap">
    <div class="panel thanksCard">
      <div class="badge" style="width:fit-content; margin:0 auto;">
        <span class="badgeDot"></span><b>Message sent</b>
      </div>
      <h1>Thank you for reaching out!</h1>
      <p>Your message is on its way. I'll get back to you as soon as I can, usually within a day or two.</p>
      <div class="ctaRow">
        <a class="btn btnPrimary" href="/">Back to portfolio</a>
        <a class="btn" href="https://linkedin.com/in/kolli-sai-jahnavi" target="_blank" rel="noreferrer">LinkedIn</a>
      </div>
    </div>
  </main>
</body>
</html>
